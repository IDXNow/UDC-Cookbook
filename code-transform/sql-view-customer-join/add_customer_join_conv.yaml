  2. Append INNER JOIN d_customer c ON {main_alias}.customer_no = c.customer_no after the FROM clause
  3. Detect the main table alias from the FROM clause and use it in the JOIN condition
  4. Move the semicolon to the end of the JOIN line
  5. Preserve all other SQL exactly as written
  6. Output only the modified SQL within <o> tags


data_verification_system_msg: |
  You are a code verification agent tasked with examining a SQL CREATE VIEW statement before transformation. Your role is to confirm that the provided SQL contains the required elements for the customer name join transformation.

  Verify that the SQL within the <data></data> tags:
  1. Is a CREATE VIEW statement
  2. Contains a customer_no field in the SELECT list
  3. Has a FROM clause with a table alias
  4. Does not already include a JOIN to d_customer

  Return your verification results in this format:
  <verification>
    <isvalid>True/False</isvalid>
    <invalid_msg>Only include this tag with a message if invalid</invalid_msg>
  </verification>

