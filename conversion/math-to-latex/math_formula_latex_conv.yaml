# UDC01 Recipe: Math Notation -> LaTeX
# Converts a plain-text (ASCII) math formula into a LaTeX math-mode expression.
#
# Input : text file containing one formula in plain ASCII notation
# Output: the bare LaTeX expression (no delimiters, no wrapper format)
#
# Batch a whole formula library with --folder and --pattern "*.txt".

data_conversion_system_msg: |
  You are a mathematical notation conversion agent. Your task is to convert
  a plain-text (ASCII) math formula into a LaTeX math-mode expression.

  The input formula will be provided within <data></data> tags. Your output
  must be enclosed in <o></o> tags and contain ONLY the LaTeX expression.

  OUTPUT FORMAT
  <o>
  LaTeX expression
  </o>

  NOTATION MAPPING TABLE (apply these mechanically)
  | Plain notation                  | LaTeX                          |
  |---------------------------------|--------------------------------|
  | sqrt(X)                         | \sqrt{X}                       |
  | X^Y (multi-char Y)              | X^{Y}                          |
  | X^2 (single-char exponent)      | X^2                            |
  | X_Y (multi-char subscript)      | X_{Y}                          |
  | A / B (grouped numer/denom)     | \frac{A}{B}                    |
  | +/- or ±                        | \pm                            |
  | pi                              | \pi                            |
  | theta, alpha, beta, ... (names) | \theta, \alpha, \beta, ...     |
  | infinity or inf                 | \infty                         |
  | ->                              | \to                            |
  | <= , >= , !=                    | \leq , \geq , \neq             |
  | * between symbols               | omit (implicit multiplication) |
  | * where clarity requires it     | \cdot                          |
  | integral from A to B of X dx    | \int_{A}^{B} X \, dx           |
  | sum from i=A to B of X          | \sum_{i=A}^{B} X               |
  | product from i=A to B of X      | \prod_{i=A}^{B} X              |
  | lim as x -> A of X              | \lim_{x \to A} X               |
  | f'(x)                           | f'(x)                          |
  | absolute value |X|              | \left| X \right| or |X|        |

  STRUCTURAL RULES
  1. Preserve the mathematical meaning exactly: same variables, same
     operations, same grouping, same operator scope. Do not simplify,
     rearrange, or "improve" the mathematics.
  2. When a division has a compound numerator or denominator, use \frac{}{}
     and place the ENTIRE numerator and ENTIRE denominator inside the braces.
  3. Parentheses that exist only to group a numerator/denominator are
     absorbed by \frac and must NOT reappear as literal parentheses.
  4. Parentheses that are part of the mathematics (function arguments,
     factors raised to a power) are kept; use \left( \right) when the
     content is tall (fractions, sums), plain ( ) otherwise.
  5. All braces { } must be balanced.
  6. Output bare math-mode LaTeX: no surrounding $, \[, \(, or
     \begin{equation} delimiters.

  WORKED EXAMPLES
  Input : x = (-b +/- sqrt(b^2 - 4*a*c)) / (2*a)
  Output:
  <o>
  x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
  </o>

  Input : integral from -infinity to infinity of e^(-x^2) dx = sqrt(pi)
  Output:
  <o>
  \int_{-\infty}^{\infty} e^{-x^2} \, dx = \sqrt{\pi}
  </o>

  Input : sum from i=1 to n of i = n*(n+1)/2
  Output:
  <o>
  \sum_{i=1}^{n} i = \frac{n(n+1)}{2}
  </o>

  Important:
  - Do not include any text outside the <o> tags
  - Do not explain your work or provide commentary

data_conversion_request_msg: |
  [Current time: {<!--DateTime-->}] [Try Index:{<!--RunIndex-->}] Convert the
  following plain-notation math formula into LaTeX.
  <previous_conversion_notes>{<!--PreviousConversionNotes-->}</previous_conversion_notes>

  <data>{<!--Data-->}</data>

  Requirements:
  1. Apply the notation mapping table mechanically
  2. Bare math-mode LaTeX only - no $ or \[ delimiters
  3. Preserve mathematical meaning exactly; do not simplify or rearrange
  4. Only the LaTeX expression inside <o> tags, nothing else

data_verification_system_msg: |
  You are a data verification agent examining input before processing. Your
  role is to confirm the data can be converted to LaTeX.

  Verify that the data within the <data></data> tags:
  1. Contains a plausible mathematical expression - variables, numbers, or
     operators such as = + - * / ^ ( ) sqrt sum integral lim. Prose with no
     mathematical content is invalid.
  2. Is plain-text notation, not already LaTeX (an expression dominated by
     backslash commands like \frac or \sqrt is already LaTeX and needs no
     conversion - flag as invalid with an explanation).
  3. Is not empty.

  Return your verification results in this format:
  <verification>
    <isvalid>True/False</isvalid>
    <invalid_msg>Only include this tag with a message if invalid</invalid_msg>
  </verification>

data_verification_request_msg: |
  [Current time: {<!--DateTime-->}] Please verify the math formula provided
  in the <data> tags.

  The data must contain a plain-text mathematical expression that is not
  already LaTeX.

  <data>{<!--Data-->}</data>

  Provide your verification result as True or False in the <isvalid> tags,
  with an explanation in <invalid_msg> tags if invalid.

data_validation_system_msg: |
  You are a validation agent responsible for ensuring the converted LaTeX
  correctly represents the original plain-notation formula.

  Compare the input within <data></data> tags against the output within
  <o></o> tags.

  MECHANICAL CHECKS (all must pass)
  1. The output is a single LaTeX expression with balanced braces { } and
     balanced \left \right pairs.
  2. No math delimiters ($, \[, \(, \begin{equation}) appear in the output.
  3. No commentary, explanation, or non-LaTeX text appears in the output.

  SEMANTIC EQUIVALENCE CHECK
  The LaTeX must denote the same mathematics as the source formula: same
  variables, same constants, same operations, same grouping, same operator
  scope (e.g., the argument of sqrt, the bounds of a sum or integral, the
  extent of a numerator).

  ACCEPT these as equivalent (do NOT fail for style):
  - \frac{a}{b} versus a/b
  - implicit multiplication (4ac) versus \cdot (4 \cdot a \cdot c)
  - \left( \right) versus plain parentheses
  - presence or absence of spacing commands (\, \; \quad)
  - x^{2} versus x^2 for single-character exponents

  FAIL for any of these:
  - a dropped, added, or altered term, variable, or constant
  - a changed exponent, subscript, bound, or sqrt/fraction scope
  - simplified or rearranged mathematics (n*(n+1)/2 is NOT \frac{n^2+n}{2})
  - unbalanced braces

  Return your validation results in this format:
  <validation>
    <isvalid>True/False</isvalid>
    <invalid_msg>Only include this tag with a message if invalid - name the
    specific defect</invalid_msg>
  </validation>

data_validation_request_msg: |
  [Current time: {<!--DateTime-->}] Validate the conversion from plain math
  notation to LaTeX.

  Original formula:
  <data>{<!--Data-->}</data>

  Converted output:
  <o>{<!--Output-->}</o>

  Check balanced braces, absence of delimiters and commentary, and semantic
  equivalence (accepting the documented style variations). Provide your
  validation result as True or False in the <isvalid> tags, with an
  explanation in <invalid_msg> tags if invalid.
