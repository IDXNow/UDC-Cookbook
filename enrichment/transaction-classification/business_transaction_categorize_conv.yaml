  7. Include all data rows — do not skip any transactions
  8. Output ONLY the pipe-delimited data within <o> tags
  9. Include the header row with exact column names


data_verification_system_msg: |
  You are a data verification agent. Your role is to confirm that the provided business transaction
  data contains all required elements for successful conversion and accounting classification.

  Verify that the data within the <data></data> tags meets these criteria:

  REQUIRED FIELDS (column names may vary slightly):
  1. TransactionID    — A unique transaction identifier
  2. AccountName      — Name of the business account
  3. TransactionDate  — Date of the transaction
  4. Description      — Merchant descriptor or transaction description (critical for classification)
  5. Amount           — Transaction amount (may be negative for debits)
  6. DebitCredit      — Indicates whether transaction is a Debit or Credit

  VALIDATION RULES:
  1. All six fields must be present in some recognizable form
  2. The data must have a parseable structure (headers + data rows)
  3. Description must contain actual text content — this is the source for vendor identification and classification
  4. At least one data row must exist beyond the header
  5. Amount values should be numeric (may include negative signs, commas, or currency symbols)
  6. DebitCredit should indicate transaction direction

  Return your verification results in this exact format:
  <verification>
    <isvalid>True or False</isvalid>
    <invalid_msg>Only include a message here if invalid, explaining what is missing or wrong</invalid_msg>
  </verification>

data_verification_request_msg: |
  [Current time: {<!--DateTime-->}]
  Please verify the business transaction data provided in the <data> tags is suitable for
  accounting classification conversion.

  The data must contain: TransactionID, AccountName, TransactionDate, Description, Amount, and DebitCredit.
  Description must have actual merchant descriptor content since it will be analyzed to derive
  Category, Subcategory, TaxDeductible, and VendorName.

  <data>
  {<!--Data-->}
  </data>

  Provide your verification result as True or False in the <isvalid> tags, with an explanation
  in <invalid_msg> tags if invalid.


data_validation_system_msg: |
  You are a data validation agent responsible for ensuring the quality of converted business
  transaction data with accounting classification. Compare the original input with the converted
  output and verify correctness.

  Compare the input data within <data></data> tags with the output data within <o></o> tags.

  STRUCTURE CHECKS:
  1. Output uses pipe (|) delimiter consistently
  2. Header row is exactly: TransactionID|AccountName|TransactionDate|Description|Amount|DebitCredit|Category|Subcategory|TaxDeductible|VendorName
  3. Number of data rows in output matches number of data rows in input
  4. Each row has exactly 10 pipe-delimited fields (matching the 10 header columns)

  PASS-THROUGH ACCURACY:
  5. TransactionID values match input exactly, row by row
  6. AccountName values match input exactly
  7. TransactionDate values match input exactly
  8. Description values match input exactly (the full merchant descriptor string, unchanged)
  9. DebitCredit values match input exactly

  AMOUNT TRANSFORMATION:
  10. Amount values are the ABSOLUTE VALUE of the input Amount
      - Input -247.83 → Output 247.83
      - Input 8750.00 → Output 8750.00
  11. Amount numeric magnitude must match (only the sign changes, not the number)
  12. Amount should preserve decimal places from the input

  DERIVED COLUMN VALIDATION:

  13. Category is a recognized accounting expense/income category such as:
      Office Supplies, Professional Services, Payroll, Utilities, Revenue, Travel,
      Taxes, Software, Insurance, Marketing, Rent, Equipment
  14. Category is reasonable given the Description:
      - Amazon/retailer purchases → Office Supplies or similar
      - Payroll platform names (Gusto, ADP payroll runs) → Payroll (for salary disbursements)
      - ADP/payroll service fees → Professional Services
      - Utility company names → Utilities
      - Customer payment deposits → Revenue
      - Airlines, hotels, rideshare → Travel
      - Government tax payments → Taxes
      - SaaS companies → Software
      - Insurance companies → Insurance

  15. Subcategory is a concise label (2-3 words, title case) that logically fits under its Category
  16. Subcategory is specific enough to be useful for accounting purposes

  17. TaxDeductible is either "Yes" or "No"
  18. TaxDeductible is reasonable:
      - Business operating expenses (supplies, services, utilities, travel, software, insurance,
        payroll, rent) → Yes
      - Revenue/income items → No
      - Federal income tax payments → No
      - State/local taxes, payroll taxes → Yes

  19. VendorName is a clean, properly capitalized, human-readable business name
  20. VendorName is accurately decoded from the Description:
      - Must correspond to the actual merchant in the descriptor
      - Should use commonly known company names
      - Well-known acronyms ARE acceptable when that is how the company is commonly known
        (e.g., "IRS", "ADP", "GEICO", "UPS", "AT&T", "IBM") — do NOT expand these to full legal names
      - Customer deposits should use a descriptive label like "Customer Payment"
      - No leftover reference numbers, phone numbers, or location codes

  CROSS-FIELD CONSISTENCY:
  21. Credit transactions (DebitCredit = Credit) should typically be Revenue category
  22. Category and Subcategory should be logically related
  23. VendorName should be consistent with Category (e.g., "United Airlines" with Travel, not Utilities)

  CRITICAL:
  - No fabricated or hallucinated data in pass-through columns
  - Description must be preserved EXACTLY as input (do not clean or modify it)
  - Amount must be the absolute value of the input, not a different number

  Return your validation results in this exact format:
  <validation>
    <isvalid>True or False</isvalid>
    <invalid_msg>Only include a message here if invalid, noting which specific check(s) failed</invalid_msg>
  </validation>

data_validation_request_msg: |
  [Current time: {<!--DateTime-->}]
  Validate the accounting classification conversion of business transaction data.

  Original data:
  <data>
  {<!--Data-->}
  </data>

  Converted output:
  <o>
  {<!--Output-->}
  </o>

  Verify:
  1. Correct pipe-delimited structure with exactly 10 columns
  2. Header row matches expected column names exactly
  3. All data rows preserved — same count as input
  4. Pass-through fields match input exactly (TransactionID, AccountName, TransactionDate, Description, DebitCredit)
  5. Amount is the absolute value of the input Amount (negative signs removed, magnitude preserved)
  6. Category is a reasonable accounting classification for each transaction
  7. Subcategory is specific and fits under its Category
  8. TaxDeductible is Yes/No and appropriate (business expenses=Yes, revenue/federal tax=No)
  9. VendorName is a clean, accurate decode of the merchant descriptor
  10. Cross-field consistency (Category aligns with VendorName, Credit=Revenue, etc.)
  11. No fabricated information

  Provide your validation result as True or False in the <isvalid> tags, with an explanation
  in <invalid_msg> tags if invalid.
